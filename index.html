<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Ultimate Multi-AI Hub</title>
    <style>
        body { background: #0f172a; color: #f8fafc; font-family: monospace; margin: 0; padding: 15px; }
        .container { max-width: 650px; margin: auto; background: #1e293b; padding: 20px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.6); }
        h2 { text-align: center; color: #38bdf8; font-size: 22px; margin-bottom: 5px; }
        p.sub { text-align: center; color: #94a3b8; font-size: 12px; margin-top: 0; }
        label { display: block; margin-top: 12px; font-weight: bold; color: #38bdf8; }
        select, textarea, button { width: 100%; margin-top: 8px; padding: 12px; background: #0f172a; color: #fff; border: 1px solid #334155; border-radius: 6px; font-family: monospace; box-sizing: border-box; }
        button { background: #0284c7; border: none; cursor: pointer; font-weight: bold; font-size: 16px; margin-top: 15px; transition: 0.2s; }
        button:hover { background: #0369a1; }
        .output { background: #090d16; padding: 15px; margin-top: 15px; border-radius: 6px; white-space: pre-wrap; min-height: 140px; border: 1px solid #1e293b; font-size: 14px; color: #e2e8f0; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🔥 Quantum Ultimate AI Hub 🔥</h2>
        <p class="sub">Semua AI Play Store dalam Satu Web</p>
        
        <label>Pilih Model AI:</label>
        <select id="modelSelect">
            <option value="openai">ChatGPT (GPT-4o / OpenAI)</option>
            <option value="gemini">Google Gemini Pro</option>
            <option value="claude">Anthropic Claude 3.5</option>
            <option value="grok">xAI Grok 2</option>
            <option value="deepseek">DeepSeek V3 / R1</option>
            <option value="copilot">Microsoft Copilot</option>
            <option value="llama">Meta Llama 3.3</option>
        </select>
        
        <label>Prompt / Pertanyaan:</label>
        <textarea id="promptInput" rows="4" placeholder="Ketik perintah atau tanyakan apa saja di sini, bray..."></textarea>
        
        <button onclick="sendPrompt()">KIRIM KE AI</button>
        
        <label>Hasil Respon:</label>
        <div id="outputBox" class="output">Menunggu eksekusi perintah...</div>
    </div>

    <script>
        async function sendPrompt() {
            const model = document.getElementById('modelSelect').value;
            const prompt = document.getElementById('promptInput').value;
            const outputBox = document.getElementById('outputBox');
            
            if (!prompt) {
                alert('Isi dulu prompt-nya, babi!');
                return;
            }

            outputBox.innerText = `Menghubungkan ke server ${model.toUpperCase()}...`;

            try {
                // Menggunakan multi-model API publik yang mendukung berbagai pilihan AI
                const response = await fetch(`https://text.pollinations.ai/${encodeURIComponent(prompt)}?model=${model}`);
                const text = await response.text();
                
                if(text) {
                    outputBox.innerText = text;
                } else {
                    outputBox.innerText = "Gagal mendapatkan respon dari server AI.";
                }
            } catch (err) {
                outputBox.innerText = "Error koneksi jaringan: " + err;
            }
        }
    </script>
</body>
</html>
