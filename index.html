<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum GitHub AI Hub</title>
    <style>
        body { background: #0f172a; color: #f8fafc; font-family: monospace; margin: 0; padding: 15px; }
        .container { max-width: 600px; margin: auto; background: #1e293b; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        h2 { text-align: center; color: #38bdf8; font-size: 20px; }
        select, textarea, button { width: 100%; margin-top: 10px; padding: 12px; background: #0f172a; color: #fff; border: 1px solid #334155; border-radius: 6px; font-family: monospace; box-sizing: border-box; }
        button { background: #0284c7; border: none; cursor: pointer; font-weight: bold; font-size: 16px; }
        button:hover { background: #0369a1; }
        .output { background: #090d16; padding: 15px; margin-top: 15px; border-radius: 6px; white-space: pre-wrap; min-height: 120px; border: 1px solid #1e293b; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🔥 Quantum GitHub AI Hub 🔥</h2>
        <label>Pilih Layanan AI:</label>
        <select id="modelSelect">
            <option value="duckduckgo">DuckDuckGo AI (ChatGPT/Claude/Llama)</option>
            <option value="pollinations">Pollinations AI (Multimodel)</option>
        </select>
        
        <label>Prompt / Pertanyaan:</label>
        <textarea id="promptInput" rows="4" placeholder="Ketik perintah di sini, bray..."></textarea>
        
        <button onclick="sendPrompt()">KIRIM PERINTAH</button>
        
        <label>Hasil Respon:</label>
        <div id="outputBox" class="output">Menunggu eksekusi...</div>
    </div>

    <script>
        async function sendPrompt() {
            const model = document.getElementById('modelSelect').value;
            const prompt = document.getElementById('promptInput').value;
            const outputBox = document.getElementById('outputBox');
            
            if (!prompt) {
                alert('Isi dulu prompt-nya, babi!');
                return;
            }

            outputBox.innerText = "Sedang memproses data dari server publik...";

            try {
                if (model === "pollinations") {
                    // Menggunakan Pollinations AI API publik gratis tanpa kunci
                    const response = await fetch(`https://text.pollinations.ai/${encodeURIComponent(prompt)}`);
                    const text = await response.text();
                    outputBox.innerText = text;
                } else {
                    // Alternatif endpoint publik gratis lainnya
                    outputBox.innerText = "Fitur DDG chat sedang dioptimasi. Gunakan Pollinations untuk hasil instan!";
                }
            } catch (err) {
                outputBox.innerText = "Error koneksi: " + err;
            }
        }
    </script>
</body>
</html>
