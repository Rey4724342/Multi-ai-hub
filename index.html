<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quantum AI V14.0 – Rey472</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://cdnjs.cloudflare.net/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f17;
            --card-bg: #131b2e;
            --accent: #38bdf8;
            --user-bubble: #1e3a8a;
            --ai-bubble: #172033;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #1e293b;
        }

        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background: var(--bg-color); color: var(--text-main); margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        /* Lock Screen */
        .lock-screen { position: fixed; inset: 0; background: var(--bg-color); display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; z-index: 999; text-align: center; }
        .lock-box { background: var(--card-bg); padding: 30px 20px; border-radius: 16px; border: 1px solid var(--border); width: 100%; max-width: 360px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .lock-title { color: #ef4444; font-size: 20px; font-weight: 700; margin-bottom: 8px; font-family: monospace; }
        .lock-input { width: 100%; padding: 12px; background: #0b0f17; color: #fff; border: 1px solid var(--border); border-radius: 10px; text-align: center; font-size: 14px; margin-top: 15px; outline: none; }
        .lock-input:focus { border-color: var(--accent); }
        .lock-btn { width: 100%; padding: 12px; background: #0284c7; color: #fff; border: none; border-radius: 10px; font-weight: bold; margin-top: 15px; cursor: pointer; transition: 0.2s; }
        .lock-btn:hover { background: #0369a1; }

        /* Main Layout */
        .app-container { display: flex; flex-direction: column; height: 100vh; width: 100%; max-width: 800px; margin: auto; background: var(--bg-color); position: relative; }

        /* Header App */
        .app-header { background: rgba(19, 27, 46, 0.8); backdrop-filter: blur(10px); padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; z-index: 10; }
        .brand-info { display: flex; align-items: center; gap: 10px; }
        .brand-logo { width: 36px; height: 36px; background: linear-gradient(135deg, #0284c7, #38bdf8); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #fff; font-size: 18px; }
        .brand-text h1 { font-size: 15px; margin: 0; color: #fff; font-weight: 600; }
        .brand-text p { font-size: 10px; margin: 0; color: var(--text-muted); font-family: monospace; }

        .header-actions { display: flex; align-items: center; gap: 8px; }
        select.model-select { background: #0b0f17; color: #fff; border: 1px solid var(--border); padding: 8px 12px; border-radius: 8px; font-size: 12px; outline: none; cursor: pointer; }
        .icon-btn { background: #1e293b; color: #ef4444; border: none; width: 34px; height: 34px; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; }
        .icon-btn:hover { background: #334155; }

        /* Chat Area */
        .chat-container { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; scroll-behavior: smooth; }
        
        .chat-bubble { display: flex; gap: 12px; max-width: 90%; }
        .chat-bubble.user { align-self: flex-end; flex-direction: row-reverse; }
        .chat-bubble.ai { align-self: flex-start; width: 100%; }

        .avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
        .user .avatar { background: #2563eb; color: #fff; }
        .ai .avatar { background: #0284c7; color: #fff; }

        .bubble-content { background: var(--ai-bubble); padding: 12px 16px; border-radius: 16px; font-size: 14px; line-height: 1.6; border: 1px solid var(--border); color: #e2e8f0; overflow-x: auto; }
        .user .bubble-content { background: var(--user-bubble); color: #fff; border: none; border-bottom-right-radius: 4px; }
        .ai .bubble-content { border-top-left-radius: 4px; width: 100%; }

        .bubble-content pre { background: #090d16; padding: 10px; border-radius: 8px; overflow-x: auto; border: 1px solid var(--border); font-family: monospace; font-size: 12px; }
        .bubble-content code { font-family: monospace; color: #38bdf8; }

        /* Input Bar */
        .input-bar-container { padding: 12px 16px; background: rgba(19, 27, 46, 0.9); backdrop-filter: blur(10px); border-top: 1px solid var(--border); }
        .input-bar { display: flex; align-items: center; background: #0b0f17; border: 1px solid var(--border); border-radius: 24px; padding: 4px 6px 4px 16px; gap: 8px; }
        .input-bar textarea { flex: 1; background: transparent; border: none; color: #fff; font-size: 14px; outline: none; resize: none; height: 24px; max-height: 100px; padding: 4px 0; }
        .send-button { background: #0284c7; color: #fff; border: none; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; flex-shrink: 0; }
        .send-button:disabled { background: #334155; opacity: 0.5; cursor: not-allowed; }

        .footer-tag { text-align: center; font-size: 10px; color: var(--text-muted); margin-top: 6px; font-family: monospace; }
    </style>
</head>
<body>

    <!-- LOCK SCREEN -->
    <div id="lockSection" class="lock-screen">
        <div class="lock-box">
            <div class="lock-title">[SYSTEM LOCKED🔒]</div>
            <p style="font-size: 12px; color: var(--text-muted); margin: 0;">Quantum V14.0 Password Gate</p>
            <input type="password" id="keyInput" class="lock-input" placeholder="Masukkan Password" onkeydown="handleLoginEnter(event)" />
            <button class="lock-btn" onclick="checkKey()">MASUK</button>
            <p id="errorMsg" style="color: #ef4444; font-size: 12px; margin-top: 10px; font-weight: bold;"></p>
        </div>
    </div>

    <!-- MAIN APP INTERFACE -->
    <div id="mainSection" class="app-container" style="display: none;">
        
        <!-- Header -->
        <div class="app-header">
            <div class="brand-info">
                <div class="brand-logo"><i class="fa-solid fa-bolt"></i></div>
                <div class="brand-text">
                    <h1>Quantum V14.0 Ultra</h1>
                    <p>© Rey472</p>
                </div>
            </div>
            <div class="header-actions">
                <select id="modelSelect" class="model-select">
                    <option value="openai">ChatGPT (Akurat & Cepat)</option>
                    <option value="deepseek">DeepSeek (Presisi Koding)</option>
                    <option value="gemini">Gemini (Respon Cepat)</option>
                    <option value="mistral">Mistral (Ultra Fast)</option>
                </select>
                <button class="icon-btn" onclick="clearChat()" title="Reset Chat"><i class="fa-solid fa-trash-can"></i></button>
            </div>
        </div>

        <!-- Chat Stream -->
        <div id="chatHistory" class="chat-container">
            <div class="chat-bubble ai">
                <div class="avatar"><i class="fa-solid fa-bolt"></i></div>
                <div class="bubble-content">
                    <strong>Quantum System v14.0 Ultra Active</strong><br>
                    Sistem sudah dioptimalkan! Respon lebih kencang & jawaban presisi akurat. Silakan ketik perintah, bray!
                </div>
            </div>
        </div>

        <!-- Input Floating Bar -->
        <div class="input-bar-container">
            <div class="input-bar">
                <textarea id="promptInput" rows="1" placeholder="Ketik pesan..." onkeydown="handleChatEnter(event)" oninput="autoExpand(this)"></textarea>
                <button id="sendBtn" class="send-button" onclick="sendPrompt()"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
            <div class="footer-tag">Quantum V14.0 • Powered by Rey472</div>
        </div>

    </div>

    <script>
        const correctKey = "adminrey472";

        function checkKey() {
            const userKey = document.getElementById('keyInput').value;
            const errorMsg = document.getElementById('errorMsg');

            if (userKey === correctKey) {
                document.getElementById('lockSection').style.display = 'none';
                document.getElementById('mainSection').style.display = 'flex';
            } else {
                errorMsg.innerText = "Password Salah!";
            }
        }

        function handleLoginEnter(e) {
            if (e.key === 'Enter') checkKey();
        }

        function handleChatEnter(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendPrompt();
            }
        }

        function autoExpand(field) {
            field.style.height = 'inherit';
            const computed = window.getComputedStyle(field);
            const height = parseInt(computed.getPropertyValue('border-top-width'), 10)
                         + field.scrollHeight
                         + parseInt(computed.getPropertyValue('border-bottom-width'), 10);
            field.style.height = Math.min(height, 100) + 'px';
        }

        function clearChat() {
            const chatHistory = document.getElementById('chatHistory');
            chatHistory.innerHTML = `
                <div class="chat-bubble ai">
                    <div class="avatar"><i class="fa-solid fa-bolt"></i></div>
                    <div class="bubble-content">
                        <strong>Quantum System v14.0</strong><br>
                        Riwayat percakapan dibersihkan.
                    </div>
                </div>`;
        }

        async function sendPrompt() {
            const model = document.getElementById('modelSelect').value;
            const promptInput = document.getElementById('promptInput');
            const userPrompt = promptInput.value.trim();
            const chatHistory = document.getElementById('chatHistory');
            const sendBtn = document.getElementById('sendBtn');
            
            if (!userPrompt) return;

            promptInput.value = '';
            promptInput.style.height = '24px';

            // User Message
            const userBubble = document.createElement('div');
            userBubble.className = 'chat-bubble user';
            userBubble.innerHTML = `
                <div class="avatar"><i class="fa-solid fa-user"></i></div>
                <div class="bubble-content">${escapeHtml(userPrompt)}</div>
            `;
            chatHistory.appendChild(userBubble);
            chatHistory.scrollTop = chatHistory.scrollHeight;

            // AI Loading Message
            const aiBubble = document.createElement('div');
            aiBubble.className = 'chat-bubble ai';
            aiBubble.innerHTML = `
                <div class="avatar"><i class="fa-solid fa-bolt"></i></div>
                <div class="bubble-content"><span style="color: var(--accent);"><i class="fa-solid fa-bolt fa-spin"></i> Memproses secara kencang & presisi...</span></div>
            `;
            chatHistory.appendChild(aiBubble);
            chatHistory.scrollTop = chatHistory.scrollHeight;

            sendBtn.disabled = true;

            let responseText = "";
            const startTime = Date.now();

            try {
                // Endpoint dioptimalkan dengan cache & routing cepat
                const fastApiUrl = `https://text.pollinations.ai/${encodeURIComponent(userPrompt)}?model=${model}&cache=true`;
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 12000); // 12 detik timeout emergency

                const res = await fetch(fastApiUrl, { signal: controller.signal });
                clearTimeout(timeoutId);
                responseText = await res.text();

                if (!responseText || responseText.includes("{}")) {
                    const fallbackRes
